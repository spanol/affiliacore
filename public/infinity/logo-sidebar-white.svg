       logo-sidebar-dark.svg (texto escuro, tema claro).
       ⚠️ NÃO aponte BRAND.logoUrl direto p/ este arquivo enquanto o app aplicar
       `invert dark:invert-0` na logo — o invert faria o roxo virar verde. Usar
       exige logo POR TEMA sem invert (flag em branding.ts, ainda não existe).
       Geometria: a mesma do logo.svg (marca verbatim do kit + wordmark em curvas).
       Anel: gradiente do mark.svg do kit. Seta: família FECHADA de roxo (a rampa
