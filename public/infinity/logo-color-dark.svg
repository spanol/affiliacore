      <path transform="translate(112,0)" d="M0 0 H11 L23 24.5 V0 H34 V40 H23 L11 15.5 V40 H0 Z" />
      <path transform="translate(153,0)" d="M0 0 H11 V40 H0 Z" />
      <path transform="translate(171,0)" d="M0 0 H32 V11 H21.5 V40 H10.5 V11 H0 Z" />
      <path transform="translate(204,0)" d="M0 0 H11.5 L16 10.5 L20.5 0 H32 L21.5 24 V40 H10.5 V24 Z" />
    </g>
  </g>

  <g transform="translate(143.5, 809) scale(3.3)" fill="none" stroke="#EDEAF2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(0,0)"     d="M0 14 L5 0 L10 14 M1.8 9.6 H8.2" />
    <path transform="translate(27.2,0)"  d="M0 14 V0 H8 M0 7.2 H6.4" />
    <path transform="translate(52.4,0)"  d="M0 14 V0 H8 M0 7.2 H6.4" />
    <path transform="translate(77.6,0)"  d="M0 0 V14" />
    <path transform="translate(94.8,0)"  d="M0 0 V14 H7.5" />
    <path transform="translate(119.5,0)" d="M0 0 V14" />
    <path transform="translate(136.7,0)" d="M0 14 L5 0 L10 14 M1.8 9.6 H8.2" />
    <path transform="translate(163.9,0)" d="M0 0 H9 M4.5 0 V14" />
    <path transform="translate(190.1,0)" d="M8 0 H0 V14 H8 M0 7.2 H6" />
    <path transform="translate(215.3,0)" d="M7.6 3 C7.6 0.6 5.6 0 4 0 C1.8 0 0 1.2 0 3.4 C0 5.6 1.8 6.4 4 7 C6.2 7.6 8 8.4 8 10.6 C8 12.8 6.2 14 4 14 C2 14 0.4 13.4 0.4 11" />
  </g>
</svg>
