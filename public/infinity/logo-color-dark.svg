<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 110" role="img" aria-label="Infinity Affiliates">
  <!-- Logo Infinity COLORIDO para fundo ESCURO (social, deck, avatar, capa).
       NÃO usar como BRAND.logoUrl: o app aplica `invert` no tema claro e o roxo
       vira verde-amarelado. Para o app use logo.svg (mono branco).
       Geometria e máscara: idênticas ao logo.svg (ver o comentário lá). O que muda
       é a cor — alça esquerda em roxo cheio, alça direita fechando em ameixa escura
       e a fita de crescimento no lavanda claro, o contraste pedido pelo cliente.
       Gradientes em userSpaceOnUse p/ a fita e a ponta partilharem a mesma rampa. -->
  <defs>
    <linearGradient id="infDloop" gradientUnits="userSpaceOnUse" x1="8" y1="86" x2="60" y2="34">
      <stop offset="0%"   stop-color="#5B21B6" />
      <stop offset="55%"  stop-color="#8B3FE0" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="infDring" gradientUnits="userSpaceOnUse" x1="60" y1="86" x2="112" y2="30">
      <stop offset="0%"   stop-color="#7A3AB8" />
      <stop offset="100%" stop-color="#22093A" />
    </linearGradient>
    <linearGradient id="infDarrow" gradientUnits="userSpaceOnUse" x1="49" y1="71" x2="112" y2="8">
      <stop offset="0%"   stop-color="#7C3AED" />
      <stop offset="45%"  stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <mask id="infCutD" maskUnits="userSpaceOnUse" x="-10" y="-10" width="150" height="130">
      <rect x="-10" y="-10" width="150" height="130" fill="#ffffff" />
      <g fill="#000000" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <path fill="none" stroke-width="17" d="M45.86 74.14 L99 21" />
        <path stroke-width="5" d="M113.85 6.15 L111.02 33.02 L86.98 8.98 Z" />
      </g>
    </mask>
  </defs>

  <g transform="translate(8.65, 10.62) scale(0.9)" fill="none" stroke-width="13" stroke-linejoin="round">
    <g mask="url(#infCutD)">
      <path stroke="url(#infDring)" d="M60 60 C60 47, 73 34, 86 34 C99 34, 112 47, 112 60
               C112 73, 99 86, 86 86 C73 86, 60 73, 60 60 Z" />
      <path stroke="url(#infDloop)" d="M60 60 C60 47, 47 34, 34 34 C21 34, 8 47, 8 60
               C8 73, 21 86, 34 86 C47 86, 60 73, 60 60 Z" />
    </g>
    <path stroke="url(#infDarrow)" stroke-linecap="round" d="M45.86 74.14 L99 21" />
    <path fill="url(#infDarrow)" stroke="none" d="M113.85 6.15 L111.02 33.02 L86.98 8.98 Z" />
  </g>

  <g transform="translate(130, 22)" fill="#ffffff">
    <path transform="translate(0,0)"   d="M0 0 H11 V40 H0 Z" />
    <path transform="translate(18,0)"  d="M0 0 H11 L23 24.5 V0 H34 V40 H23 L11 15.5 V40 H0 Z" />
    <path transform="translate(59,0)"  d="M0 0 H28 V11 H11 V16.5 H24 V27.5 H11 V40 H0 Z" />
    <path transform="translate(94,0)"  d="M0 0 H11 V40 H0 Z" />
    <path transform="translate(112,0)" d="M0 0 H11 L23 24.5 V0 H34 V40 H23 L11 15.5 V40 H0 Z" />
    <path transform="translate(153,0)" d="M0 0 H11 V40 H0 Z" />
    <path transform="translate(171,0)" d="M0 0 H32 V11 H21.5 V40 H10.5 V11 H0 Z" />
    <path transform="translate(204,0)" d="M0 0 H11.5 L16 10.5 L20.5 0 H32 L21.5 24 V40 H10.5 V24 Z" />
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156.5 88 L161.5 74 L166.5 88 M158.2 83.2 H164.8" />
    <path d="M179.3 88 V74 H187.3 M179.3 81 H185.8" />
    <path d="M200.1 88 V74 H208.1 M200.1 81 H206.6" />
    <path d="M220.9 74 V88" />
    <path d="M233.7 74 V88 H241.2" />
    <path d="M254 74 V88" />
    <path d="M266.8 88 L271.8 74 L276.8 88 M268.5 83.2 H275.1" />
    <path d="M289.6 74 H298.6 M294.1 74 V88" />
    <path d="M318.9 74 H311.4 V88 H318.9 M311.4 81 H317.4" />
    <path d="M339.3 77 C339.3 74.6, 337.3 74, 335.7 74 C333.5 74, 331.7 75.2, 331.7 77.4
             C331.7 79.6, 333.5 80.4, 335.7 81 C337.9 81.6, 339.7 82.4, 339.7 84.6
             C339.7 86.8, 337.9 88, 335.7 88 C333.7 88, 332.1 87.4, 332.1 85" />
  </g>
</svg>
