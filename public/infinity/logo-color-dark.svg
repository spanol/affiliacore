<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Infinity Affiliates">
  <!-- Logo Infinity COLORIDO p/ fundo ESCURO — reprodução da REFERÊNCIA do cliente
       (2026-07-28, imagem 1): lockup EMPILHADO quadrado (símbolo, INFINITY,
       AFFILIATES) com fundo preto e halo roxo. NÃO usar como BRAND.logoUrl: o app
       aplica `invert` no tema claro (roxo vira verde) e o lockup do app é o
       horizontal (logo.svg, mono).

       Marca: dois anéis ENTRELAÇADOS (r=26, centros 34 e 82 — d=48 < 2r, é o
       entrelace que faz o ∞ da referência; tangente ficava "duas bolas") com a
       FITA DE CRESCIMENTO sobre o eixo x+y=118, que passa no centro do cruzamento
       (58,60) e sai em seta gorda com entalhe na base. Fita stroke 10 (10/62 do Ø
       externo ≈ a esbeltez da referência; 13 ficava atarracado). Aqui em COR não
       há máscara: a sobreposição é resolvida por ORDEM DE PINTURA + tom (anel
       direito escuro atrás, esquerdo vivo, fita com glow por cima) — igual à
       referência, que não tem vão nenhum. O glow branco no cruzamento e o fade do
       anel direito p/ quase-preto são da referência. Gradientes em userSpaceOnUse
       nas coordenadas da MARCA (o <g> transformado resolve o espaço).

       Wordmark INFINITY em curvas com scale(1.2,1) — os glifos base são mais
       condensados que a referência; o stretch deixa haste 13.2/40 ≈ o peso dela.
       AFFILIATES monolinha stroke 3.2, tracking constante (gap 17.2), largura
       ~0.92× a do INFINITY como na referência. -->
  <defs>
    <radialGradient id="dAmb" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0%"  stop-color="#7C3AED" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dLf" gradientUnits="userSpaceOnUse" x1="10" y1="88" x2="58" y2="34">
      <stop offset="0%"   stop-color="#6D28D9" />
      <stop offset="55%"  stop-color="#9333EA" />
      <stop offset="100%" stop-color="#B06CF9" />
    </linearGradient>
    <linearGradient id="dRt" gradientUnits="userSpaceOnUse" x1="64" y1="36" x2="114" y2="82">
      <stop offset="0%"   stop-color="#9B6EE8" />
      <stop offset="45%"  stop-color="#5F2E96" />
      <stop offset="100%" stop-color="#33194F" />
    </linearGradient>
    <linearGradient id="dSh" gradientUnits="userSpaceOnUse" x1="47" y1="71" x2="104" y2="14">
      <stop offset="0%"   stop-color="#8B5CF6" />
      <stop offset="19%"  stop-color="#F2E8FE" />
      <stop offset="55%"  stop-color="#D4B2FA" />
      <stop offset="100%" stop-color="#E7D4FE" />
    </linearGradient>
    <linearGradient id="dHd" gradientUnits="userSpaceOnUse" x1="79" y1="39" x2="104" y2="14">
      <stop offset="0%"   stop-color="#C89FF8" />
      <stop offset="100%" stop-color="#F7F0FF" />
    </linearGradient>
    <radialGradient id="dGl" gradientUnits="userSpaceOnUse" cx="58" cy="60" r="11">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#060408" />
  <rect width="1024" height="1024" fill="url(#dAmb)" />

  <g transform="translate(170, 7) scale(5.6)" fill="none" stroke-width="10" stroke-linejoin="round">
    <path stroke="url(#dRt)" d="M108 60 C108 45.64 96.36 34 82 34 C67.64 34 56 45.64 56 60
             C56 74.36 67.64 86 82 86 C96.36 86 108 74.36 108 60 Z" />
    <path stroke="url(#dLf)" d="M60 60 C60 45.64 48.36 34 34 34 C19.64 34 8 45.64 8 60
             C8 74.36 19.64 86 34 86 C48.36 86 60 74.36 60 60 Z" />
    <path stroke="url(#dSh)" stroke-linecap="round" d="M47 71 L89 29" />
    <circle cx="58" cy="60" r="11" fill="url(#dGl)" stroke="none" />
    <path fill="url(#dHd)" stroke="none" d="M104 14 L94.8 41.6 L89.8 28.2 L76.4 23.2 Z" />
  </g>

  <g transform="translate(112.5, 645) scale(2.82)">
    <g transform="scale(1.2, 1)" fill="#ffffff">
      <path transform="translate(0,0)"   d="M0 0 H11 V40 H0 Z" />
      <path transform="translate(18,0)"  d="M0 0 H11 L23 24.5 V0 H34 V40 H23 L11 15.5 V40 H0 Z" />
      <path transform="translate(59,0)"  d="M0 0 H28 V11 H11 V16.5 H24 V27.5 H11 V40 H0 Z" />
