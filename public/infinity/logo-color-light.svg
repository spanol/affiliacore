               C112 73, 99 86, 86 86 C73 86, 60 73, 60 60 Z" />
      <path stroke="url(#infLloop)" d="M60 60 C60 47, 47 34, 34 34 C21 34, 8 47, 8 60
               C8 73, 21 86, 34 86 C47 86, 60 73, 60 60 Z" />
    </g>
    <path stroke="url(#infLarrow)" stroke-linecap="round" d="M45.86 74.14 L99 21" />
    <path fill="url(#infLarrow)" stroke="none" d="M113.85 6.15 L111.02 33.02 L86.98 8.98 Z" />
  </g>

  <g transform="translate(130, 22)" fill="#1A1024">
