<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 110" role="img" aria-label="Infinity Affiliates">
  <!-- Logo Infinity COLORIDO para fundo CLARO (contrato, proposta, apresentação).
       Roxo mais fechado que a versão dark (o lavanda claro sumiria no branco) e a
       alça direita fecha em PRETO, como na referência do cliente p/ fundo claro.
       O wordmark vai em ameixa escura: a referência mandou o wordmark BRANCO, que
       no branco fica invisível — aqui ele é escuro p/ o arquivo ser utilizável.
       NÃO usar como BRAND.logoUrl — ver logo.svg. Geometria/máscara: idem logo.svg. -->
  <defs>
    <linearGradient id="infLloop" gradientUnits="userSpaceOnUse" x1="8" y1="86" x2="60" y2="34">
      <stop offset="0%"   stop-color="#5B1E86" />
      <stop offset="50%"  stop-color="#8332B9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="infLring" gradientUnits="userSpaceOnUse" x1="60" y1="86" x2="112" y2="30">
      <stop offset="0%"   stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="infLarrow" gradientUnits="userSpaceOnUse" x1="49" y1="71" x2="112" y2="8">
      <stop offset="0%"   stop-color="#6D28D9" />
      <stop offset="50%"  stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <mask id="infCutL" maskUnits="userSpaceOnUse" x="-10" y="-10" width="150" height="130">
      <rect x="-10" y="-10" width="150" height="130" fill="#ffffff" />
      <g fill="#000000" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <path fill="none" stroke-width="17" d="M45.86 74.14 L99 21" />
        <path stroke-width="5" d="M113.85 6.15 L111.02 33.02 L86.98 8.98 Z" />
      </g>
    </mask>
  </defs>

  <g transform="translate(8.65, 10.62) scale(0.9)" fill="none" stroke-width="13" stroke-linejoin="round">
