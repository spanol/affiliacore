<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Infinity Affiliates">
  <!-- Logo Infinity COLORIDO p/ fundo CLARO — reprodução da REFERÊNCIA do cliente
       (2026-07-28, imagem 2): mesmo lockup empilhado do logo-color-dark.svg (ver o
       comentário técnico lá — geometria, entrelace e ordem de pintura são idênticos)
       sobre fundo claro. Diferenças fiéis à referência: o anel direito fecha em
       PRETO, o símbolo projeta sombra suave e o wordmark é BRANCO com sombra —
       sim, branco: é como está na imagem do cliente; a sombra é o que o torna
       legível no claro (efeito relevo). Se algum uso precisar de wordmark escuro
       chapado, é só trocar os fills — mas o padrão segue a referência.
       NÃO usar como BRAND.logoUrl (ver logo.svg). -->
  <defs>
