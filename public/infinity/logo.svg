<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 110" role="img" aria-label="Infinity Affiliates">
  <!-- Logo Infinity — MONO BRANCO DE PROPÓSITO. O app aplica `invert dark:invert-0`
       (DashboardLayout, Login, Register, InviteAccept, Forgot/ResetPassword): branco
       vira preto no tema claro e segue branco no escuro. NÃO colorir este arquivo.

       Lockup HORIZONTAL exclusivo do app (a 30px de altura o lockup empilhado final
       seria ilegível). A MARCA é a FINAL do cliente, copiada VERBATIM do kit
       (claude.ai/design 9041822a, 2026-07-29 — ver mono-white.svg): lemniscata em
       UM path só (diagonais cruzando + dois arcos r=60, stroke 42) cuja diagonal
       continua como haste da seta (mesma linha, mesma largura — por isso se funde),
       silhueta sólida sem vãos. Não reintroduza máscara/weave: o mono final é chapado.

       O wordmark do kit é <text font-family="Archivo"> — SVG carregado via <img>
       NÃO baixa webfont (cairia em Arial), então aqui o wordmark segue DESENHADO EM
       CURVAS (INFINITY com scale(1.2,1) ≈ peso/largura do Archivo 900; AFFILIATES
       monolinha com tracking largo). A diferença pro Archivo real é invisível na
       escala do app; quem precisa do texto fiel usa os lockups finais coloridos. -->

