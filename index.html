<!doctype html>
<!-- lang="pt-BR": a UI é toda em português. Com lang="en" o Chrome via "página em
     inglês, usuário em pt-BR" e disparava a TRADUÇÃO AUTOMÁTICA, que traduz até o
     nome da marca no <title> ("Infinity" → "infinidade", queixa do cliente em
     2026-07-31). Todo o resto do repo (landing/, public/) já declarava pt-BR. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- P4.1: defaults = marca do PRODUTO (AffiliaCore). A marca da INSTÂNCIA entra em
         runtime no boot do App (applyBrandToDocument) via VITE_BRAND_* — este HTML é
         compartilhado por todas as instâncias. -->
    <link rel="icon" type="image/svg+xml" sizes="110x110" href="/affiliacore/favicon.svg" />
    <link rel="shortcut icon" href="/affiliacore/favicon.svg" />
    <!-- translate="no": cinto e suspensório p/ quem FORÇA a tradução mesmo com o
         lang certo. applyBrandToDocument só troca o TEXTO do título (document.title),
         então o atributo daqui sobrevive à marca da instância. -->
    <title translate="no">AffiliaCore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
