# Instância CLIENTE · Infinity — projeto Firebase `infinity-affiliacore`.
#
# Ativação (one-time, console do projeto infinity-affiliacore): App Hosting →
# backend → Settings → Environment → nome `infinity` → Save. Playbook completo
# em scripts/provision/README.md. Admin inicial provisório: viniciusspanol@gmail.com
# (trocar assim que o cliente indicar o e-mail definitivo).
env:
  # OTG-free: padrão de venda white-label; roda 100% em casas manuais.
  - variable: VITE_OTG_ENABLED
    value: 'false'
    availability:
      - BUILD
      - RUNTIME

  # Marketplace de acordos/parcerias (P2/P3): módulo opt-in (default OFF no repo →
  # a Boost/instância nº 0 NÃO ganha as telas). A Infinity pediu, então liga aqui.
  # Reverter = trocar p/ 'false' (ou remover) e re-rollout. Ver src/lib/instance.ts.
  - variable: VITE_MARKETPLACE_ENABLED
    value: 'true'
    availability:
      - BUILD
      - RUNTIME

  # Marca do cliente.
  - variable: VITE_BRAND_NAME
    value: 'Infinity'
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_BRAND_SHORT
    value: 'Infinity'
    availability:
      - BUILD
      - RUNTIME

  # Placeholders servidos pelo próprio bundle (public/infinity/* → dist/). SEM
  # estas envs o resolver de branding cai no fallback do produto e a instância
  # do cliente sobe exibindo o logo da AffiliaCore. Trocar pela URL dos assets
  # oficiais quando o cliente entregar (env, zero rebuild).
  - variable: VITE_BRAND_LOGO_URL
    value: '/infinity/logo.svg'
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_BRAND_FAVICON_URL
    value: '/infinity/favicon.svg'
    availability:
      - BUILD
      - RUNTIME

  # Logo POR TEMA com o ∞ em roxo (pedido do cliente 2026-07-29): par completo
  # → o app troca a logo pelo tema SEM `invert` (InstanceLogo). ⚠️ Os nomes dos
  # arquivos cruzam de propósito: "sidebar-dark" = TEXTO escuro → tema CLARO;
  # "sidebar-white" = TEXTO branco → tema ESCURO. O VITE_BRAND_LOGO_URL acima
  # segue declarado como fallback mono (e-mails/usos fora do app).
  - variable: VITE_BRAND_LOGO_LIGHT_URL
    value: '/infinity/logo-sidebar-dark.svg'
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_BRAND_LOGO_DARK_URL
    value: '/infinity/logo-sidebar-white.svg'
    availability:
      - BUILD
      - RUNTIME

  # Roxo principal passado pelo cliente. A engine gera a escala accent-* +
  # contraste WCAG em runtime.
  - variable: VITE_BRAND_ACCENT
    value: '#8332B9'
    availability:
      - BUILD
      - RUNTIME

  # VITE_BRAND_THEME NÃO declarado: a instância segue a preferência do SO de cada
  # usuário. ⚠️ Desde P5.6 isso vale TAMBÉM para a landing pública (a LP era
  # dark-only e virou theme-aware, com toggle na nav) — ou seja, visitante com o
  # SO no claro vê a landing da Infinity CLARA. Se o cliente quiser a porta de
  # entrada sempre escura, declarar aqui `VITE_BRAND_THEME: 'dark'` (é BUILD:
  # só vale no próximo rollout). Ver PRODUTIZACAO.md § "LP theme-aware".

  # Canvas/surface NÃO são declarados de propósito: fundo PRETO do produto
  # (defaults do index.css — neutral + navy #141C2A). Era o que o cliente
  # esperava e não acontecia: até 2026-07-28 o apphosting.yaml BASE pinava o
  # ember da AffiliaCore e esta instância o HERDAVA, deixando modais e cards
  # avermelhados. O tema saiu do base (foi p/ apphosting.demo.yaml) e o
  # invariante está travado em src/lib/instanceTheming.test.ts.

  - variable: FIREBASE_STORAGE_BUCKET
    value: 'infinity-affiliacore.firebasestorage.app'
    availability:
      - RUNTIME

  # FIREBASE_SERVICE_ACCOUNT_KEY: override plain para cair em ADC no runtime da
  # App Hosting sem depender da geração manual da chave JSON neste 1º rollout.
  # O server.ts trata valor não-JSON como placeholder e volta para ADC.
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    value: 'unused'
    availability:
      - RUNTIME

  # --- Neutralização dos secrets OTG do apphosting.yaml base -----------------
  # O base referencia secrets que SÓ existem no projeto da instância 0 (Carlos).
  # Instância OTG-free sobrepõe com plain 'unused' (NUNCA string vazia — env
  # vazio reprova na validação do rollout). Ver apphosting.demo.yaml.
  - variable: AFFILIATE_API_KEY
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_LINKS_SUPABASE_URL
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_LINKS_SUPABASE_ANON_KEY
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_LINKS_EMAIL
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_LINKS_PASSWORD
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_DASH_EMAIL
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_DASH_PASSWORD
    value: 'unused'
    availability:
      - RUNTIME
  - variable: OTG_DASH_DEVICE_TOKEN
    value: 'unused'
    availability:
      - RUNTIME

  # Lembrete do ranking (o base referencia o secret master-admin-email, que não
  # existe neste projeto — override plain com o admin provisório da instância).
  - variable: MASTER_ADMIN_EMAIL
    value: 'viniciusspanol@gmail.com'
    availability:
      - RUNTIME

  # --- Pull horário do relatório da Esportiva (TAP by Smartico) --------------
  # Chave de AFILIADO da conta 544865. Só existe nesta instância, por isso é
  # declarada aqui e não no apphosting.yaml base (declarar um secret ausente no
  # projeto quebra o build com `misconfigured-secret`).
  #
  # ⚠️ ORDEM: criar o secret ANTES de subir este arquivo —
  #   firebase apphosting:secrets:set esportiva-api-key --project infinity-affiliacore
  #   firebase apphosting:secrets:grantaccess esportiva-api-key \
  #     --project infinity-affiliacore --backend infinity-server
  #
  # Sem a chave a rota POST /api/internal/esportiva-pull responde 503 (feature off).
  # Contrato e armadilhas: MIGRACAO-INFINITY-LEGADO.md §9.5 e §9.6.
  - variable: ESPORTIVA_API_KEY
    secret: esportiva-api-key
    availability:
      - RUNTIME

  # Casa do backoffice /casas que recebe o pull.
  - variable: ESPORTIVA_HOUSE_SLUG
    value: 'esportiva-bet'
    availability:
      - RUNTIME

  # Régua de CPA da casa, em R$. A API só devolve a comissão em DINHEIRO; a
  # CONTAGEM de CPA (que multiplica a taxa do afiliado) sai de dividir por este
  # valor. Se a Esportiva mudar o CPA, mude aqui no MESMO dia — até lá o resto da
  # divisão aparece como alarme (`cpaRemainder`) na resposta e na auditoria.
  - variable: ESPORTIVA_CPA_BASE
    value: '120'
    availability:
      - RUNTIME

  # FIREBASE_SERVICE_ACCOUNT_KEY e RANKING_CRON_SECRET seguem como SECRETS do
  # base — criar os dois no projeto infinity-affiliacore (playbook §3).
  # O RANKING_CRON_SECRET é o MESMO header do Scheduler do pull horário.
